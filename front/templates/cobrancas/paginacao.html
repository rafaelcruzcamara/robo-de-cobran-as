{% if pagina.has_other_pages %}
  <nav class="pagination" aria-label="Paginação">
    {% if pagina.has_previous %}<a href="?pagina={{ pagina.previous_page_number }}{% if busca %}&q={{ busca|urlencode }}{% endif %}">Anterior</a>{% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
    {% if pagina.has_next %}<a href="?pagina={{ pagina.next_page_number }}{% if busca %}&q={{ busca|urlencode }}{% endif %}">Próxima</a>{% endif %}
  </nav>
{% endif %}
